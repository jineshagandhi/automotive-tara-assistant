# External interface (entry point) catalogue
#
# attack_vector  ISO/SAE 21434 attack vector class of the interface
# factors        default attack potential for reaching the ECU behind the
#                interface, as level names from the methodology profile.
#                These are starting estimates for the analyst to review.
# r155           Annex 5 Part A threats that typically apply to the interface,
#                used to steer retrieval and to build R155 coverage
# keywords       terms used to detect the interface in architecture documents
# pivot          false for receive-only radio links (GNSS, TPMS, key fob): an
#                attacker can inject data into the receiving ECU but cannot
#                use the link to take over that ECU and move further

cellular:
  label: Cellular / telematics (4G, 5G)
  attack_vector: Network
  factors: {elapsed_time: "<= 1 week", expertise: Expert, knowledge: Restricted, window: Unlimited, equipment: Standard}
  r155: ["16.1", "16.2", "5.1", "6.2", "7.1", "8.1", "29.1"]
  keywords: [cellular, telematics, lte, 4g, 5g, modem, sim, esim, tcu]

